# Risk-tiered verification on every push to main.
#
# Every push proves types and the lint ratchet. Unit tests run in the light
# job only when the full job will not, so no test executes twice for one
# commit. A change the classifier cannot vouch for gets coverage floors, the
# web export and its byte budget.
#
# There is no deploy job yet. When one lands, measure the diff from the last
# GREEN run rather than `github.event.before`: Helix found a failed run's
# changes handed to a follow-up that could not see them, and green `main`
# sitting ahead of production for days.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older run's answer worthless: it certifies a commit
# that is no longer the head of main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_gate: ${{ steps.route.outputs.full_gate }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A dispatch has no honest diff, so it passes no base and gets the
      # classifier's fail-open full gate. So does the first push, whose
      # `before` is all zeros.
      - id: route
        name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/classify-changes.mjs "$BASE_SHA" "$HEAD_SHA"

  light:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:ratchet
      - if: needs.classify.outputs.full_gate != 'true'
        run: npm test

  full:
    needs: classify
    if: needs.classify.outputs.full_gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run web:export
      - run: npm run bundle:check
