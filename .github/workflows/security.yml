# Answers that change without a commit: a new CodeQL query, a registry
# signature. Ported from Helix, and kept off the delivery path for Helix's
# reason — a check that can turn red with no commit of ours would fail a commit
# after it had passed. It runs on the paths that can matter, and weekly.
#
# Helix's third job, the advisory audit (`check-advisories.mjs`), is not ported
# yet: its allowlist is Helix's own dependency tree. docs/BACKLOG.md carries it.
name: security

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "scripts/**"
      - "supabase/**"
      - ".github/workflows/**"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: analyze javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:javascript-typescript"

  signatures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --yes npm@12.0.2 audit signatures
