version: 2
# Dependabot opens nothing, as in Helix. Both ecosystems are capped at zero open
# pull requests, which is how a version update is switched off: this tree is
# delivered by committing to `main`, and a dependency moves when someone applies
# it there, gates it and pushes — the only way the lockfile is recomputed
# against the tree it ships with. `security.yml` still reports what is
# vulnerable, in a run instead of in a branch.
#
# The `ignore` list is the record of what must not move on its own and why.
# Raise a limit and it all applies again, unchanged.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      safe-npm-updates:
        update-types: [minor, patch]
    # The Expo SDK owns the compatible React / React Native / native-library
    # matrix, and Dependabot reads React Native's pre-1.0 minors as ordinary
    # ones. These move only together, in a deliberate SDK upgrade — Helix's
    # rule, after an automated bump desynchronised Reanimated from its worklets
    # runtime while `expo install --check` still reported the SDK's versions.
    ignore:
      - dependency-name: "expo*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-web"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-worklets"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      # ESLint 10 and TypeScript 7 are blocked by the lint plugins Expo's config
      # bundles: Helix measured `eslint-plugin-react` still calling an API
      # ESLint 10 removed, and `@typescript-eslint` refusing TypeScript past 6.0.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Vitest's major moves with the mutation gate, which is not built yet:
      # Helix measured Vitest 5 breaking Stryker's per-test attribution, and
      # Gital already runs 5 (docs/BACKLOG.md "Mutation testing").
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      # `@types/node` follows the runtime `.nvmrc` pins, not the registry: types
      # for a newer Node describe APIs this runtime does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Istanbul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns: ["*"]
